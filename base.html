<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Telegram Hosting' }}</title><style>
body{font-family:Arial;background:#0f172a;color:#e5e7eb;margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}
.card{background:#1e293b;padding:18px;border-radius:14px;margin:14px 0}input,select,button{padding:11px;margin:5px 0;border-radius:8px;border:0}input,select{width:100%;box-sizing:border-box}button{cursor:pointer;background:#22c55e;color:#fff}.danger{background:#ef4444}a{color:#60a5fa;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:#94a3b8}.status{font-weight:bold}</style></head><body><div class="wrap">{% block content %}{% endblock %}</div></body></html>
